<!DOCTYPE HTML>
<html>
    <head>
        <title>HTML Code</title>
    </head>

    <body>
        <!--Form Creation-->
        <h2>Student form</h2>
        <form>
            <!--Text-->
            Enter Name:<br>
            <input type = "text" name="textfields" placeholder="Enter your name"><br><br>

            <!--Checkboxes-->
            Subject:<br>
            English<input type = "checkbox" name = "Subject" value="English"><br>
            Maths<input type = "checkbox" name = "Subject" value = "Maths"><br><br>

            <!--Radio Buttons-->
            Gender:<br>
            Male<input type = "radio" name = "gender"><br>
            Female<input type = "radio" name = "gender"><br>
            
            <!--Password-->
            <br>
            Password:
            <input type = "Password" name = "password"><br>

            <!--Submit button--><br>
            <input type = "Submit" value = "submit"><br>

        </form>
    </body>
</html>
