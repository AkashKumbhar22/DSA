<!--Write HTML+JavaScript code to dynamically change the content of
paragraph by using getElementById() method and inner HTML property.-->

<!Doctype html>
<html>
    <body>
        <p id ="Demo">Hello World</p>
        <button onClick="changetext()">Click Me</button>

        <script>
            function changetext(){
                document.getElementById("Demo").innerHTML("Hello Akash")
            }
        </script>
    </body>
</html>
