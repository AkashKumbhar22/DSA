<!DOCTYPE HTML>
<html>
    <head>
        <title>
            Operators
        </title>
    </head>

<body>
    <script>
        let a = 15;
        let b = 5;
        alert("Addition = " + (a+b));
        alert("Subtraction = " + (a-b));
        alert("Multiplication = " + (a*b));
        alert("Division = " + (a/b));
       
    </script>
</body>
</html>
